# Stack de la web, la API y Postgres en el VPS. Va detrás de Traefik (red externa «proxy», certresolver «letsencrypt»).
# Se copia al servidor en /opt/apps/projects/rubenrosalesdev/ y lo actualiza el workflow de GitHub Actions.
services:
  web:
    image: ghcr.io/rubenfgr/rubenrosalesdev-web:latest
    container_name: rubenrosales-web
    restart: unless-stopped
    env_file: .env
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # HTTPS en el dominio principal
      - traefik.http.routers.rr-web.rule=Host(`rubenrosales.dev`)
      - traefik.http.routers.rr-web.entrypoints=websecure
      - traefik.http.routers.rr-web.tls.certresolver=letsencrypt
      - traefik.http.services.rr-web.loadbalancer.server.port=4321
      # HTTP → HTTPS
      - traefik.http.routers.rr-web-http.rule=Host(`rubenrosales.dev`) || Host(`www.rubenrosales.dev`)
      - traefik.http.routers.rr-web-http.entrypoints=web
      - traefik.http.routers.rr-web-http.middlewares=rr-https
      - traefik.http.middlewares.rr-https.redirectscheme.scheme=https
      - traefik.http.middlewares.rr-https.redirectscheme.permanent=true
      # www → dominio principal
      - traefik.http.routers.rr-www.rule=Host(`www.rubenrosales.dev`)
      - traefik.http.routers.rr-www.entrypoints=websecure
      - traefik.http.routers.rr-www.tls.certresolver=letsencrypt
      - traefik.http.routers.rr-www.middlewares=rr-nowww
      - traefik.http.middlewares.rr-nowww.redirectregex.regex=^https://www\.rubenrosales\.dev/(.*)
      - traefik.http.middlewares.rr-nowww.redirectregex.replacement=https://rubenrosales.dev/$${1}
      - traefik.http.middlewares.rr-nowww.redirectregex.permanent=true
    security_opt:
      - no-new-privileges:true

  api:
    image: ghcr.io/rubenfgr/rubenrosalesdev-api:latest
    container_name: rubenrosales-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # Mismo dominio que la web, solo el prefijo /api/v1 (prioridad mayor que la web)
      - traefik.http.routers.rr-api.rule=Host(`rubenrosales.dev`) && PathPrefix(`/api/v1`)
      - traefik.http.routers.rr-api.entrypoints=websecure
      - traefik.http.routers.rr-api.tls.certresolver=letsencrypt
      - traefik.http.routers.rr-api.priority=100
      - traefik.http.services.rr-api.loadbalancer.server.port=3000
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17
    container_name: rubenrosales-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # Proveedor alternativo del LLM con modelos open (coste cero). Solo arranca con el profile «llm-local»:
  #   docker compose --profile llm-local up -d ollama
  # No activar sin comprobar RAM/CPU/disco del VPS (docs/backend.md). Sin puertos expuestos.
  ollama:
    image: ollama/ollama:latest
    container_name: rubenrosales-ollama
    profiles: [llm-local]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    networks:
      - internal
      - proxy # solo para descargar modelos (la red internal no tiene salida)
    labels:
      - traefik.enable=false
    security_opt:
      - no-new-privileges:true

  # Copia nocturna de Postgres: pg_dump -Fc en el volumen «backups», con retención de 14 (BACKUP_KEEP).
  # Hace una copia al arrancar y otra cada 24 h. Forzar una ahora: `docker compose restart backup`.
  # Restaurar: docs/restaurar-backup.md. La copia externa (T-8.2) se añadirá cuando se elija el destino.
  backup:
    image: postgres:17
    container_name: rubenrosales-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP: "14"
    volumes:
      - backups:/backups
    networks:
      - internal
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/rr-$$(date -u +%Y%m%d-%H%M).dump
          if pg_dump -Fc -f "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "backup ok: $$f ($$(du -h "$$f" | cut -f1))"; else rm -f "$$f.tmp"; echo "backup FALLO"; fi
          ls -1t /backups/rr-*.dump 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f
          sleep 86400
        done
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  backups:
  ollama:

networks:
  proxy:
    external: true
  # Red privada API ↔ Postgres (sin acceso exterior; la API sale a Internet por «proxy»).
  internal:
    internal: true
