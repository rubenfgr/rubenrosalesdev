key: RUB
main_branch: main
autonomy:
  backlog: auto
  analysis: auto
  approve: auto
  close: auto
  implement: auto
  phases: auto
  phase_review: auto
  review: auto
workflow:
  mode: main
runner:
  setup_command: pnpm install --frozen-lockfile
  checks:
    - pnpm check
    - pnpm test
    - pnpm build:prod
docs:
  language: es
  domains:
    web: SEO, marca, sistema de diseño, blog y redirecciones de la web pública
    api: Backend, formulario de contacto y privacidad operativa
    asistente: El asistente y su despliegue progresivo (rollout)
    operaciones: Despliegue, restauración de backups y pruebas locales
    planificacion: Proyecto insignia y planificación que no describe comportamiento actual
  reference_check: node apps/web/scripts/generate-redirects.mjs --check
rules: |
  Los tests de la API (`pnpm test`) necesitan `TEST_DATABASE_URL` apuntando a un Postgres; sin ella fallan.
  `pnpm e2e` necesita Chrome y levanta servidores: es manual y no forma parte de los checks.
conversation:
  isolate_user_config: false
name: Ruben Rosales Dev
