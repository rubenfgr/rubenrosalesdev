name: Deploy

# Solo `main` despliega en producción (rubenrosales.dev). Las demás ramas solo pasan por ci.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_WEB: ghcr.io/rubenfgr/rubenrosalesdev-web
  IMAGE_API: ghcr.io/rubenfgr/rubenrosalesdev-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Login en GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # GUARDS_STRICT=1: el build falla si queda un [VERIFICAR] o un borrador enlazado (nada de eso llega a producción).
      - name: Construir imagen de la web
        run: |
          docker build -f apps/web/Dockerfile --build-arg GUARDS_STRICT=1 \
            --build-arg PUBLIC_ASSISTANT_ENABLED="${{ vars.PUBLIC_ASSISTANT_ENABLED }}" \
            --build-arg PUBLIC_CF_ANALYTICS_TOKEN="${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}" \
            -t "$IMAGE_WEB:latest" -t "$IMAGE_WEB:${{ github.sha }}" .
      - name: Construir imagen de la API
        run: docker build -f apps/api/Dockerfile -t "$IMAGE_API:latest" -t "$IMAGE_API:${{ github.sha }}" .
      - name: Publicar imágenes
        run: |
          docker push "$IMAGE_WEB:latest"
          docker push "$IMAGE_WEB:${{ github.sha }}"
          docker push "$IMAGE_API:latest"
          docker push "$IMAGE_API:${{ github.sha }}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Preparar SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copiar compose y reiniciar
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p ${{ secrets.VPS_PORT || 22 }}"
          DEST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          scp -i ~/.ssh/id_deploy -P ${{ secrets.VPS_PORT || 22 }} deploy/compose.yml "$DEST:/opt/apps/projects/rubenrosalesdev/compose.yml"
          $SSH "$DEST" "cd /opt/apps/projects/rubenrosalesdev && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"
