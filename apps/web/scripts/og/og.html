<!doctype html>
<!-- Plantilla de la imagen Open Graph (1200×630). Se renderiza con scripts/og/render.mjs; ?lang=es|en. -->
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Archivo'; font-weight: 100 900; font-stretch: 62% 125%; src: url('../../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2') format('woff2-variations'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 100 800; src: url('../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2-variations'); }
  :root { --paper: #F4F5F2; --ink: #1E2725; --muted: #5E6865; --signal: #A84A31; --rule: #C9CDC6; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: var(--paper); color: var(--ink); font-family: 'Archivo'; position: relative; overflow: hidden; }
  .top { position: absolute; inset: 48px 64px auto 64px; display: flex; align-items: center; gap: 14px; padding-top: 14px; border-top: 2px solid var(--ink); font-size: 26px; font-weight: 700; }
  .top img { width: 40px; height: 40px; }
  .top .role { color: var(--muted); font-weight: 500; }
  h1 { position: absolute; left: 64px; top: 148px; font-size: 128px; line-height: 0.94; font-weight: 800; font-stretch: 118%; letter-spacing: -0.04em; }
  h1 .dot { color: var(--signal); }
  .url { position: absolute; left: 64px; bottom: 44px; font-family: 'JetBrains Mono'; font-size: 22px; font-weight: 500; letter-spacing: 0.06em; }
  .hilada { position: absolute; right: 0; bottom: 0; width: 480px; height: 144px; color: #C9CDC6; }
</style>
<body>
  <div class="top"><img src="../../src/assets/logo/symbol.svg" alt="" /><span id="name">Rubén Rosales</span><span class="role" id="role"></span></div>
  <h1 id="title"></h1>
  <div class="url">rubenrosales.dev</div>
  <svg class="hilada" viewBox="0 0 480 144" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
    <!-- Motivo hilada (copia de src/assets/motifs/hilada.svg a 1,5×, dos teselas) -->
    <defs><pattern id="h" width="360" height="144" patternUnits="userSpaceOnUse"><g transform="scale(1.5)"><path d="M0 0.5H240M0 32.5H240M0 64.5H240"/><path d="M38.5 0V32.5M101.5 0V32.5M178.5 0V32.5"/><path d="M14.5 32.5V64.5M72.5 32.5V64.5M139.5 32.5V64.5M209.5 32.5V64.5"/><path d="M50.5 64.5V96M117.5 64.5V96M190.5 64.5V96"/></g></pattern></defs>
    <rect width="480" height="144" fill="url(#h)" stroke="none"/>
  </svg>
  <script>
    const T = {
      es: { role: '| Ingeniería & IA', l: ['Procesos que', 'funcionan', 'solos'] },
      en: { role: '| Engineering & AI', l: ['Processes that', 'run', 'themselves'] },
    };
    const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'es';
    document.getElementById('role').textContent = T[lang].role;
    document.getElementById('title').innerHTML = `${T[lang].l[0]}<br>${T[lang].l[1]}<br>${T[lang].l[2]}<span class="dot">.</span>`;
  </script>
</body>
